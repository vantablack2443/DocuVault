{{- if .Values.devDependencies.enabled }}
# Throwaway Postgres and Redis for smoke tests. No persistence, fixed
# credentials: never enable this outside a test cluster.
{{- $name := include "docuvault.name" . }}
{{- range $dep := list (dict "name" "postgres" "image" "pgvector/pgvector:pg17" "port" 5432) (dict "name" "redis" "image" "redis:7-alpine" "port" 6379) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $dep.name }}
  labels:
    {{- include "docuvault.labels" $ | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $dep.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $dep.name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ $dep.name }}
          image: {{ $dep.image }}
          ports:
            - containerPort: {{ $dep.port }}
          {{- if eq $dep.name "postgres" }}
          env:
            - { name: POSTGRES_USER, value: docuvault }
            - { name: POSTGRES_PASSWORD, value: docuvault }
            - { name: POSTGRES_DB, value: docuvault }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "docuvault"]
            periodSeconds: 3
          {{- else }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 3
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ $dep.name }}
  labels:
    {{- include "docuvault.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $dep.name }}
  ports:
    - port: {{ $dep.port }}
      targetPort: {{ $dep.port }}
{{- end }}
{{- end }}
