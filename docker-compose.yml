x-backend-env: &backend-env
  ENVIRONMENT: local
  DATABASE_URL: postgresql+asyncpg://docuvault:docuvault@postgres:5432/docuvault
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: INFO
  LLM_MODE: replay
  # Local-only values. Real deployments set these in the host's secret store.
  JWT_SECRET: local-compose-only-secret-0123456789abcdef
  SEED_ADMIN_EMAIL: admin@beispiel.test
  SEED_ADMIN_PASSWORD: local-demo-password

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: docuvault
      POSTGRES_PASSWORD: docuvault
      POSTGRES_DB: docuvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuvault -d docuvault"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: backend
      target: runtime
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: backend
      target: runtime
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  test:
    profiles: ["test"]
    build:
      context: backend
      target: dev
    environment:
      <<: *backend-env
      ENVIRONMENT: test
      REDIS_URL: redis://redis:6379/1
    command: ["sh", "-c", "ruff check . && ruff format --check . && mypy && alembic upgrade head && alembic check && pytest"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
