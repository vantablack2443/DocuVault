# Weekly update proposals. Minor and patch updates are grouped into one pull
# request per area so the repository is not flooded.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      javascript: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directories: [/backend, /web]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
