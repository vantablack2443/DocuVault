name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docuvault
          POSTGRES_PASSWORD: docuvault
          POSTGRES_DB: docuvault
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docuvault -d docuvault"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://docuvault:docuvault@localhost:5432/docuvault
      REDIS_URL: redis://localhost:6379/1
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - name: Models and migrations agree
        run: uv run alembic check
      - run: uv run pytest
      - name: Redaction benchmark (fails below benchmark/thresholds.json)
        run: uv run python -m benchmark --check | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target runtime -t docuvault-api:ci backend

  web:
    name: Dashboard (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
