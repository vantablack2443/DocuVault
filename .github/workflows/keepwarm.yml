name: keep-warm

# The free hosting tier stops the container after a period without traffic and
# needs up to a minute to start it again. A cheap request to the liveness probe
# (no database, no Redis) keeps the demo responsive during the day.
#
# Limits worth knowing: GitHub delays scheduled runs under load, so some
# visitors still hit a cold start (the dashboard shows a "waking up" notice);
# and GitHub switches schedules off after 60 days without repository activity.
on:
  schedule:
    - cron: "*/10 6-21 * * *"   # every 10 minutes, 06:00-21:59 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Set the repository variable KEEPWARM_URL to the API base URL to switch this on.
    if: vars.KEEPWARM_URL != ''
    steps:
      - name: Ping liveness probe
        env:
          URL: ${{ vars.KEEPWARM_URL }}
        run: curl -sS --max-time 90 --retry 2 -o /dev/null -w "%{http_code} in %{time_total}s\n" "$URL/healthz"
