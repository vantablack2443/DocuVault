name: security

# Looks for known problems rather than testing behaviour: vulnerable
# dependencies, secrets in the history, fixable flaws in the container image,
# and suspicious code patterns. Kept apart from CI on purpose: a newly published
# advisory turns this red without anyone having changed the code. The weekly
# run catches those.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Python (pip-audit against the lockfile)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.audit.txt
          # The spaCy model is installed from a release URL and has no PyPI
          # advisory feed; pip-audit lists it as skipped.
          uvx pip-audit -r requirements.audit.txt --disable-pip --no-deps
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: JavaScript (npm audit, high and above)
        working-directory: web
        run: npm audit --audit-level=high

  secrets:
    name: Secrets in the git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history, not just the latest commit
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1

  image:
    name: Fixable flaws in the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target runtime -t docuvault-api:scan backend
      - name: Trivy (high and critical, only where a fix exists)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            docuvault-api:scan

  codeql:
    name: Code scanning (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
