[project]
name = "docuvault"
version = "0.1.0"
description = "LLM gateway with German PII minimisation, RBAC and a tamper-evident audit log"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "spacy>=3.8,<3.9",
    # Small German pipeline (about 15 MB). Larger or transformer models break the memory budget.
    "de-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
# RUF001/RUF003: names such as "Yılmaz" are data, not typos.
ignore = ["RUF001", "RUF003"]

[tool.ruff.lint.isort]
# The local `alembic/` migrations folder would otherwise shadow the library.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
# Natural-language sentence templates are kept on one line each.
"benchmark/corpus.py" = ["E501"]

[tool.mypy]
strict = true
files = ["app", "tests", "benchmark"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
# SQLAlchemy's async engine hops through greenlets; without this, lines after
# an awaited database call are reported as never executed.
concurrency = ["greenlet", "thread"]
