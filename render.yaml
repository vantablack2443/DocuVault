# Render blueprint for the API. Secrets are entered in the Render dashboard
# (sync: false); nothing sensitive lives in this file.
services:
  - type: web
    name: docuvault-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # The free plan has no pre-deploy step, so migrations run before the server starts.
    # A script, not an inline `sh -c "…"`: Render passes a quoted command on as one word.
    dockerCommand: sh start.sh
    healthCheckPath: /healthz
    autoDeploy: true
    # Dashboard and documentation changes must not restart the API.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_MODE
        value: live
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Set by Cloudflare (Render's front door) and overwritten if a client sends it.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: PROXY_SECRET
        sync: false
