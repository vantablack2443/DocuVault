# Render blueprint for the API. Secrets are entered in the Render dashboard
# (sync: false); nothing sensitive lives in this file.
services:
  - type: web
    name: docuvault-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # The free plan has no pre-deploy step, so migrations run before the server starts.
    dockerCommand: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_MODE
        value: live
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: METRICS_TOKEN
        sync: false
